{% extends "base.html" %}{% block title %}New invoice — PayPilot{% endblock %}{% block content %}
<div class="narrow"><div class="pagehead"><div><div class="eyebrow">BILLING</div><h1>Create an invoice</h1><p class="muted">Record an amount and a due date for a customer.</p></div></div>
<div class="panel"><form method="post" action="/invoices" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf }}">
{% if not customers %}<div class="alert">You need to add a customer before creating an invoice. <a href="/customers">Add a customer →</a></div>{% endif %}
<label>Customer<select name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label>
<label>Invoice description<input name="description" required maxlength="180" placeholder="e.g. Website design — November"></label>
<div class="form-grid"><label>Amount<input type="number" name="amount" min="0.01" max="9999999999.99" step="0.01" required placeholder="1200.00"></label><label>Currency<select name="currency"><option>USD</option><option>EUR</option><option>GBP</option></select></label></div>
<label>Due date<input type="date" name="due_date" required></label><button class="btn primary" {% if not customers %}disabled{% endif %}>Create invoice <span>→</span></button></form></div></div>
{% endblock %}
