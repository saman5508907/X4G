<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>{% block title %}PayPilot{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brandmark">P</span> PayPilot</a>
{% if user %}<nav><a href="/dashboard">Overview</a><a href="/customers">Customers</a><a href="/invoices/new">New invoice</a></nav>
<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="linkbtn">Log out</button></form>
{% else %}<nav><a href="/login">Log in</a><a class="nav-cta" href="/register">Get started</a></nav>{% endif %}</header>
<main>{% block content %}{% endblock %}</main><footer>PayPilot · Clear invoices. Confident cash flow.</footer>
<script src="/static/app.js" defer></script></body></html>
